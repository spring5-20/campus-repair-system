<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园报修系统 · 学生项目完整可点击原型</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17262f;
      --muted: #71808a;
      --line: #dfe7e9;
      --page: #f3f6f4;
      --surface: #ffffff;
      --brand: #15594f;
      --brand-2: #267a6b;
      --brand-soft: #e7f1ed;
      --gold: #d2a54a;
      --warning: #a56416;
      --warning-soft: #fff3d8;
      --danger: #b34545;
      --danger-soft: #fbe9e9;
      --info: #315d9b;
      --info-soft: #eaf1fb;
      --success: #24704e;
      --success-soft: #e7f5ec;
      --shadow: 0 10px 28px rgba(22, 61, 53, .08);
      --radius: 15px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--page); }
    body { margin: 0; color: var(--ink); background: var(--page); font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    :focus-visible { outline: 3px solid rgba(38, 122, 107, .25); outline-offset: 2px; }

    .cr-login { min-height: 100vh; display: grid; grid-template-columns: minmax(360px, .95fr) minmax(440px, 1.05fr); }
    .cr-login-visual { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 70px clamp(34px, 8vw, 110px); color: #fff; background: linear-gradient(140deg, #103c36, #1d5e52); }
    .cr-login-visual::before, .cr-login-visual::after { content: ""; position: absolute; border: 1px solid rgba(225, 188, 103, .22); border-radius: 50%; }
    .cr-login-visual::before { width: 430px; height: 430px; right: -190px; top: -145px; }
    .cr-login-visual::after { width: 260px; height: 260px; left: -115px; bottom: -100px; }
    .cr-login-mark { display: grid; width: 58px; height: 58px; place-items: center; color: #173f37; background: #e1bd65; border-radius: 17px; font-size: 28px; font-weight: 700; }
    .cr-login-visual h1 { max-width: 520px; margin: 30px 0 14px; font-family: "Songti SC", serif; font-size: clamp(34px, 4.5vw, 52px); line-height: 1.25; }
    .cr-login-visual > p { max-width: 520px; margin: 0; color: #bed1cb; font-size: 15px; line-height: 1.8; }
    .cr-flow-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .cr-flow-preview span { padding: 8px 11px; color: #f0d88f; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.09); border-radius: 8px; font-size: 12px; }
    .cr-login-form-wrap { display: grid; place-items: center; padding: 34px; }
    .cr-login-card { width: min(440px, 100%); padding: 34px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 24px 65px rgba(24, 59, 51, .13); }
    .cr-kicker { margin: 0 0 7px; color: #a57c28; font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    .cr-login-card h2 { margin: 0 0 7px; color: #163b34; font-size: 26px; }
    .cr-login-card > p { margin: 0 0 25px; color: var(--muted); font-size: 13px; }
    .cr-field { display: grid; gap: 7px; margin-bottom: 16px; }
    .cr-field label, .cr-field legend { color: #40515a; font-size: 13px; font-weight: 600; }
    .cr-field input, .cr-field select, .cr-field textarea { width: 100%; padding: 10px 12px; color: var(--ink); background: var(--surface); border: 1px solid #cfdadd; border-radius: 9px; outline: 0; transition: border-color .16s, box-shadow .16s; }
    .cr-field input:focus, .cr-field select:focus, .cr-field textarea:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(38, 122, 107, .12); }
    .cr-field textarea { min-height: 112px; resize: vertical; line-height: 1.65; }
    .cr-help { color: #8a969d; font-size: 11px; line-height: 1.5; }
    .cr-error { margin-bottom: 14px; padding: 10px 12px; color: var(--danger); background: var(--danger-soft); border-radius: 9px; font-size: 12px; }
    .cr-btn { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; color: #3a4a53; background: #fff; border: 1px solid #cfdbde; border-radius: 9px; text-decoration: none; transition: .16s ease; }
    .cr-btn:hover:not(:disabled) { transform: translateY(-1px); border-color: #9fb8b2; }
    .cr-btn-primary { color: #fff; background: var(--brand); border-color: var(--brand); }
    .cr-btn-primary:hover:not(:disabled) { background: #104b42; border-color: #104b42; }
    .cr-btn-danger { color: var(--danger); background: #fff; border-color: #e2b7b7; }
    .cr-btn-ghost { background: transparent; border-color: transparent; }
    .cr-btn-block { width: 100%; min-height: 45px; }
    .cr-demo-accounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; padding-top: 18px; border-top: 1px solid #ebeff0; }
    .cr-demo-accounts button { padding: 8px 6px; color: #3b6158; background: #eff5f2; border: 0; border-radius: 8px; font-size: 12px; }

    .cr-app { min-height: 100vh; }
    .cr-topbar { position: sticky; z-index: 20; top: 0; height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 22px; color: #fff; background: #173f38; box-shadow: 0 5px 18px rgba(17, 48, 42, .18); }
    .cr-brand { display: flex; align-items: center; gap: 10px; min-width: 190px; }
    .cr-brand-mark { display: grid; width: 37px; height: 37px; place-items: center; color: #183f37; background: #dfb95e; border-radius: 11px; font-size: 19px; font-weight: 700; }
    .cr-brand strong, .cr-brand small { display: block; }
    .cr-brand strong { font-size: 15px; letter-spacing: .05em; }
    .cr-brand small { margin-top: 2px; color: #91afa7; font-size: 9px; letter-spacing: .12em; }
    .cr-role-switch { display: flex; gap: 4px; padding: 4px; background: rgba(255,255,255,.08); border-radius: 10px; }
    .cr-role-switch button { padding: 7px 13px; color: #afc4be; background: transparent; border: 0; border-radius: 7px; font-size: 12px; }
    .cr-role-switch button[aria-pressed="true"] { color: #173f38; background: #f1d27e; }
    .cr-top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 9px; min-width: 190px; }
    .cr-user-badge { display: flex; align-items: center; gap: 8px; }
    .cr-avatar { display: grid; width: 34px; height: 34px; place-items: center; color: #173f38; background: #c9ddd7; border-radius: 50%; font-size: 13px; font-weight: 700; }
    .cr-user-badge strong, .cr-user-badge small { display: block; }
    .cr-user-badge strong { font-size: 11px; }
    .cr-user-badge small { margin-top: 2px; color: #9eb8b1; font-size: 9px; }
    .cr-topbar .cr-btn { min-height: 32px; padding: 5px 8px; color: #d4e2de; font-size: 11px; }

    .cr-shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); }
    .cr-sidebar { position: sticky; top: 68px; height: calc(100vh - 68px); padding: 20px 14px; background: #fff; border-right: 1px solid var(--line); }
    .cr-sidebar nav { display: grid; gap: 6px; }
    .cr-nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; color: #62727a; background: transparent; border: 0; border-radius: 9px; text-align: left; }
    .cr-nav-btn:hover { color: var(--brand); background: #f0f5f3; }
    .cr-nav-btn[aria-current="page"] { color: #fff; background: var(--brand); }
    .cr-nav-icon { width: 21px; text-align: center; }
    .cr-sidebar-note { position: absolute; right: 14px; bottom: 20px; left: 14px; padding: 13px; color: #62736e; background: var(--brand-soft); border-radius: 10px; font-size: 11px; line-height: 1.65; }
    .cr-sidebar-note strong { display: block; margin-bottom: 4px; color: #28584e; }
    .cr-content { min-width: 0; padding: 25px clamp(16px, 3vw, 34px) 42px; }
    .cr-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .cr-page-head h1 { margin: 0 0 6px; font-family: "Songti SC", serif; font-size: 27px; }
    .cr-page-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .cr-page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .cr-phase-label { display: inline-flex; margin-bottom: 7px; padding: 4px 8px; color: #8a661e; background: #fff2cf; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: .08em; }

    .cr-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 17px; }
    .cr-metric { padding: 17px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 5px 16px rgba(24,55,48,.04); }
    .cr-metric span { color: var(--muted); font-size: 12px; }
    .cr-metric strong { display: block; margin: 9px 0 4px; color: #16493f; font-size: 27px; }
    .cr-metric small { color: #929da3; font-size: 10px; }
    .cr-grid-two { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(290px, .7fr); gap: 16px; }
    .cr-panel { min-width: 0; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 5px 16px rgba(24,55,48,.04); }
    .cr-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .cr-panel h2, .cr-panel-head h2 { margin: 0; font-size: 16px; }
    .cr-panel-head > span { color: var(--muted); font-size: 11px; }
    .cr-flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-bottom: 17px; padding: 14px 18px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
    .cr-flow-step { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; color: #8a969c; }
    .cr-flow-step:not(:last-child)::after { content: ""; position: absolute; top: 13px; left: 33px; right: 6px; height: 2px; background: #dfe7e8; }
    .cr-flow-dot { z-index: 1; grid-row: 1 / 3; display: grid; width: 27px; height: 27px; place-items: center; background: #e8edef; border-radius: 50%; font-size: 11px; font-weight: 700; }
    .cr-flow-step strong { z-index: 1; align-self: end; color: #66747b; font-size: 11px; }
    .cr-flow-step small { color: #9aa4a9; font-size: 9px; }
    .cr-flow-step.is-done .cr-flow-dot, .cr-flow-step.is-current .cr-flow-dot { color: #fff; background: var(--brand-2); }
    .cr-flow-step.is-done:not(:last-child)::after { background: #74a99c; }
    .cr-flow-step.is-current strong, .cr-flow-step.is-done strong { color: #24564c; }

    .cr-toolbar { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 14px; }
    .cr-toolbar input, .cr-toolbar select { min-height: 37px; padding: 7px 10px; color: var(--ink); background: #fff; border: 1px solid #cfdadd; border-radius: 8px; }
    .cr-toolbar input { width: min(280px, 100%); }
    .cr-toolbar select { width: 150px; }
    .cr-table-wrap { overflow-x: auto; }
    .cr-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .cr-table th { padding: 10px 11px; color: #7d898f; background: #f5f7f7; text-align: left; white-space: nowrap; font-weight: 600; }
    .cr-table td { padding: 12px 11px; border-bottom: 1px solid #edf1f2; vertical-align: middle; }
    .cr-table tbody tr { cursor: pointer; }
    .cr-table tbody tr:hover { background: #f7faf9; }
    .cr-ticket-title { display: block; max-width: 430px; color: #21483f; font-size: 13px; }
    .cr-secondary-text { display: block; margin-top: 4px; color: #8b969c; font-size: 10px; }
    .cr-status { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 999px; font-size: 10px; white-space: nowrap; }
    .cr-status.pending { color: var(--warning); background: var(--warning-soft); }
    .cr-status.processing { color: var(--info); background: var(--info-soft); }
    .cr-status.resolved { color: var(--success); background: var(--success-soft); }
    .cr-status.closed, .cr-status.cancelled { color: #66727a; background: #edf0f2; }
    .cr-priority { font-weight: 700; }
    .cr-priority.high { color: var(--danger); }
    .cr-priority.medium { color: var(--warning); }
    .cr-priority.low { color: var(--success); }
    .cr-pagination { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 14px; color: var(--muted); font-size: 11px; }
    .cr-pagination button { display: grid; width: 32px; height: 32px; place-items: center; color: #516168; background: #fff; border: 1px solid #d7e0e2; border-radius: 8px; }
    .cr-empty { padding: 46px 20px; color: var(--muted); text-align: center; }

    .cr-quick-list { display: grid; gap: 9px; }
    .cr-quick-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px; color: #3d4f56; background: #f5f8f7; border: 0; border-radius: 10px; text-align: left; }
    .cr-quick-icon { display: grid; flex: 0 0 35px; width: 35px; height: 35px; place-items: center; color: #225a4f; background: #dcebe6; border-radius: 9px; }
    .cr-quick-item strong, .cr-quick-item small { display: block; }
    .cr-quick-item strong { font-size: 12px; }
    .cr-quick-item small { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .cr-mini-bars { height: 190px; display: flex; align-items: flex-end; gap: 14px; padding: 12px 8px 0; border-bottom: 1px solid #dfe6e8; }
    .cr-mini-bar-group { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; }
    .cr-mini-bar { width: min(34px, 62%); min-height: 4px; background: linear-gradient(#3b806f, #1f5e51); border-radius: 5px 5px 0 0; }
    .cr-mini-bar-group span { color: #8b969b; font-size: 9px; }
    .cr-mini-bar-group strong { color: #41635a; font-size: 10px; }

    .cr-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 15px; }
    .cr-full { grid-column: 1 / -1; }
    .cr-radio-row { display: flex; flex-wrap: wrap; gap: 9px; }
    .cr-radio { display: flex; align-items: center; gap: 6px; padding: 9px 12px; background: #f4f7f6; border-radius: 8px; font-size: 12px; }
    .cr-upload { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 13px; background: #f5f8f7; border: 1px dashed #b9cbc6; border-radius: 10px; }
    .cr-upload input { min-width: 0; padding: 0; border: 0; background: transparent; }
    .cr-photo-preview { display: flex; align-items: center; gap: 11px; }
    .cr-photo-preview img { width: 68px; height: 54px; object-fit: cover; border-radius: 8px; }
    .cr-form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 5px; }

    .cr-detail-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); gap: 16px; }
    .cr-detail-section + .cr-detail-section { margin-top: 19px; padding-top: 17px; border-top: 1px solid #edf1f2; }
    .cr-detail-section h2 { margin-bottom: 11px; }
    .cr-kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .cr-kv span, .cr-kv strong { display: block; }
    .cr-kv span { color: #8a959b; font-size: 10px; }
    .cr-kv strong { margin-top: 4px; color: #41515a; font-size: 12px; }
    .cr-description { margin: 0; color: #526169; font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
    .cr-attachment { display: flex; align-items: center; gap: 9px; margin-top: 11px; padding: 10px; background: #f3f7f5; border-radius: 9px; font-size: 11px; }
    .cr-attachment img { width: 62px; height: 48px; object-fit: cover; border-radius: 7px; }
    .cr-comment { position: relative; padding: 10px 12px; background: #f6f8f8; border-radius: 9px; }
    .cr-comment + .cr-comment { margin-top: 8px; }
    .cr-comment strong { font-size: 11px; }
    .cr-comment time { margin-left: 8px; color: #97a0a5; font-size: 9px; }
    .cr-comment p { margin: 6px 0 0; color: #58666d; font-size: 11px; line-height: 1.6; }
    .cr-comment-form { display: flex; gap: 8px; margin-top: 10px; }
    .cr-comment-form input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid #d1dcde; border-radius: 8px; }
    .cr-assignee { display: flex; align-items: center; gap: 10px; margin: 13px 0; padding: 11px; background: #f3f7f5; border-radius: 9px; }
    .cr-assignee strong, .cr-assignee span { display: block; }
    .cr-assignee strong { font-size: 12px; }
    .cr-assignee span { margin-top: 3px; color: var(--muted); font-size: 9px; }
    .cr-stack-actions { display: grid; gap: 8px; }
    .cr-stack-actions .cr-btn { width: 100%; }
    .cr-assign-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
    .cr-assign-row select { min-width: 0; padding: 8px; border: 1px solid #ced9dc; border-radius: 8px; }
    .cr-timeline { display: grid; gap: 0; }
    .cr-timeline-item { position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr); grid-template-rows: auto auto; padding-bottom: 14px; }
    .cr-timeline-item:not(:last-child)::after { content: ""; position: absolute; top: 12px; bottom: 0; left: 5px; width: 1px; background: #cfdcda; }
    .cr-timeline-dot { z-index: 1; grid-row: 1 / 3; width: 11px; height: 11px; margin-top: 2px; background: var(--brand-2); border: 3px solid #dcebe6; border-radius: 50%; }
    .cr-timeline-item strong { color: #42535a; font-size: 11px; }
    .cr-timeline-item span:last-child { margin-top: 3px; color: #8b969c; font-size: 9px; line-height: 1.55; }

    .cr-modal-layer { position: fixed; z-index: 50; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(16, 36, 32, .45); }
    .cr-modal { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; padding: 23px; background: #fff; border-radius: 16px; box-shadow: 0 30px 80px rgba(17, 45, 39, .25); }
    .cr-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .cr-modal-head h2 { margin: 0; font-size: 19px; }
    .cr-modal-close { display: grid; width: 34px; height: 34px; place-items: center; color: #607078; background: #f0f3f3; border: 0; border-radius: 50%; }
    .cr-checklist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .cr-checklist li { display: flex; gap: 8px; color: #526169; font-size: 12px; line-height: 1.55; }
    .cr-checklist li::before { content: "✓"; color: var(--success); font-weight: 700; }
    .cr-toast { position: fixed; z-index: 80; right: 22px; bottom: 22px; max-width: min(390px, calc(100vw - 44px)); padding: 12px 15px; color: #fff; background: #173f38; border-radius: 10px; box-shadow: var(--shadow); font-size: 12px; animation: cr-in .18s ease; }
    @keyframes cr-in { from { transform: translateY(8px); opacity: 0; } }

    @media (max-width: 1060px) {
      .cr-metrics { grid-template-columns: repeat(2, 1fr); }
      .cr-grid-two, .cr-detail-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 780px) {
      .cr-login { grid-template-columns: 1fr; }
      .cr-login-visual { min-height: 360px; padding: 48px 30px; }
      .cr-shell { grid-template-columns: 1fr; }
      .cr-topbar { height: auto; min-height: 68px; flex-wrap: wrap; padding: 12px 14px; }
      .cr-role-switch { order: 3; width: 100%; }
      .cr-role-switch button { flex: 1; }
      .cr-brand, .cr-top-actions { min-width: 0; }
      .cr-user-badge > div { display: none; }
      .cr-sidebar { position: static; height: auto; padding: 10px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .cr-sidebar nav { display: flex; min-width: max-content; }
      .cr-nav-btn { width: auto; }
      .cr-sidebar-note { display: none; }
      .cr-content { padding-top: 18px; }
      .cr-page-head { flex-direction: column; }
      .cr-page-actions { width: 100%; justify-content: stretch; }
      .cr-page-actions .cr-btn { flex: 1; }
      .cr-flow { overflow-x: auto; grid-template-columns: repeat(4, minmax(145px, 1fr)); }
    }
    @media (max-width: 540px) {
      .cr-login-form-wrap { padding: 18px; }
      .cr-login-card { padding: 24px; }
      .cr-demo-accounts { grid-template-columns: 1fr; }
      .cr-metrics, .cr-form-grid, .cr-kv { grid-template-columns: 1fr; }
      .cr-full { grid-column: auto; }
      .cr-toolbar input, .cr-toolbar select, .cr-toolbar .cr-btn { width: 100%; }
      .cr-comment-form, .cr-upload, .cr-assign-row { grid-template-columns: 1fr; flex-direction: column; }
      .cr-form-actions { flex-direction: column-reverse; }
      .cr-form-actions .cr-btn { width: 100%; }
      .cr-top-actions .cr-btn[data-action="show-guide"] { display: none; }
    }
  </style>
</head>
<body>
  <div id="campus-repair-app"></div>
  <script>
    (() => {
      const root = document.getElementById('campus-repair-app');
      const accounts = {
        student: { password: 'student123', name: '学生用户', role: 'student', label: '学生端' },
        tech: { password: 'tech123', name: '维修人员', role: 'tech', label: '维修端' },
        admin: { password: 'admin123', name: '系统管理员', role: 'admin', label: '管理端' }
      };

      const priorityLabels = { HIGH: '紧急', MEDIUM: '普通', LOW: '较低' };

      function flowMarkup(ticket) {
        const stageMap = { PENDING: 1, PROCESSING: 2, RESOLVED: 3, CLOSED: 4, CANCELLED: 1 };

        const stages = [['学生报修','提交工单'],['维修接单','认领或指派'],['完成维修','提交处理结果'],['学生确认','关闭工单']];
        return `<section class="cr-flow" aria-label="工单状态流程">${stages.map((item,index) => {
          const step = index + 1;
          const cls = ticket.status === 'CANCELLED' ? '' : step < current ? 'is-done' : step === current ? 'is-current' : '';
          return `<div class="cr-flow-step ${cls}"><span class="cr-flow-dot">${step < current ? '✓' : step}</span><strong>${item[0]}</strong><small>${item[1]}</small></div>`;
        }).join('')}</section>`;
      }

      function metric(label, value, hint) {
        return `<article class="cr-metric"><span>${label}</span><strong>${value}</strong><small>${hint}</small></article>`;
      }

        return `<header class="cr-page-head"><div><span class="cr-phase-label">学生端表单</span><h1>提交报修</h1><p>信息越完整，维修人员越容易提前准备工具与配件。</p></div><div class="cr-page-actions"><button class="cr-btn" data-action="navigate" data-view="dashboard">返回首页</button></div></header>
        <section class="cr-panel"><form id="ticket-form" novalidate>${state.formError ? `<div class="cr-error" role="alert">${escapeHtml(state.formError)}</div>` : ''}<div class="cr-form-grid">
          <div class="cr-field cr-full"><label for="new-title">故障标题 *</label><input id="new-title" name="title" placeholder="例如：实训室投影仪无法显示"><span class="cr-help">3—80 个字符</span></div>
          <div class="cr-field"><label for="new-category">故障分类 *</label><select id="new-category" name="category"><option>教学设备</option><option>电脑设备</option><option>网络故障</option><option>水电设施</option></select></div>
          <div class="cr-field"><label for="new-location">故障位置 *</label><input id="new-location" name="location" placeholder="楼栋、楼层和房间号"><span class="cr-help">至少 2 个字符</span></div>
          <fieldset class="cr-field cr-full" style="border:0;padding:0"><legend>优先级 *</legend><div class="cr-radio-row"><label class="cr-radio"><input type="radio" name="priority" value="LOW">较低</label><label class="cr-radio"><input type="radio" name="priority" value="MEDIUM" checked>普通</label><label class="cr-radio"><input type="radio" name="priority" value="HIGH">紧急</label></div></fieldset>
          <div class="cr-field cr-full"><label for="new-description">故障描述 *</label><textarea id="new-description" name="description" placeholder="请描述故障表现、发生时间以及已经尝试过的处理方法"></textarea><span class="cr-help">5—1000 个字符</span></div>
          <div class="cr-field cr-full"><label for="new-photo">现场照片</label><div class="cr-upload"><input id="new-photo" name="photo" type="file" accept="image/jpeg,image/png" data-action="photo"><div id="photo-state">${state.draftAttachment ? photoPreviewMarkup(state.draftAttachment) : '<span class="cr-help">支持 JPG、PNG，建议不超过 5 MB</span>'}</div></div></div>
        </div><div class="cr-form-actions"><button class="cr-btn" type="reset" data-action="reset-form">清空</button><button class="cr-btn cr-btn-primary" type="submit">提交工单</button></div></form></section>`;
      }

      function photoPreviewMarkup(attachment) {
        return `<div class="cr-photo-preview">${attachment.preview ? `<img src="${attachment.preview}" alt="现场照片预览">` : '<span class="cr-quick-icon">图</span>'}<span><strong style="display:block;font-size:11px">${escapeHtml(attachment.name)}</strong><small class="cr-help">已选择，可重新选择</small></span></div>`;
      }

      function addLog(ticket, action, title, from, to, detail) {
        ticket.logs.push({ action, title, detail: `${detail} · ${nowLabel()}`, from, to });
        ticket.updatedAt = nowLabel();
      }

      function renderDetail() {
        const ticket = ticketById(state.selectedId);
        if (!ticket) { state.view = 'tickets'; return renderTickets(); }
        const canAccept = state.role === 'tech' && ticket.status === 'PENDING';
        const canResolve = state.role === 'tech' && ticket.status === 'PROCESSING' && ticket.assigneeId === 'tech';
        const canCancel = state.role === 'student' && ticket.status === 'PENDING' && ticket.reporterId === 'student';
        const canClose = state.role === 'student' && ticket.status === 'RESOLVED' && ticket.reporterId === 'student';
        const adminPending = state.role === 'admin' && ticket.status === 'PENDING';
        const adminResolve = state.role === 'admin' && ticket.status === 'PROCESSING';
        const adminClose = state.role === 'admin' && ticket.status === 'RESOLVED';
        return `<header class="cr-page-head"><div><button class="cr-btn cr-btn-ghost" data-action="navigate" data-view="tickets">← 返回列表</button><h1 style="margin-top:9px">${escapeHtml(ticket.title)}</h1><p>${ticket.ticketNo} · 创建于 ${ticket.createdAt}</p></div><div>${statusBadge(ticket.status)}</div></header>
        ${flowMarkup(ticket)}
        <div class="cr-detail-grid"><section class="cr-panel">
          <div class="cr-detail-section"><h2>故障信息</h2><div class="cr-kv"><div><span>故障分类</span><strong>${escapeHtml(ticket.category)}</strong></div><div><span>故障位置</span><strong>${escapeHtml(ticket.location)}</strong></div><div><span>优先级</span><strong>${priorityLabels[ticket.priority]}</strong></div><div><span>报修人</span><strong>${escapeHtml(ticket.reporterName)}</strong></div></div></div>
          <div class="cr-detail-section"><h2>故障描述</h2><p class="cr-description">${escapeHtml(ticket.description)}</p>${ticket.attachment ? `<div class="cr-attachment">${ticket.attachment.preview ? `<img src="${ticket.attachment.preview}" alt="附件预览">` : '<span class="cr-quick-icon">图</span>'}<span>附件：${escapeHtml(ticket.attachment.name)}</span></div>` : ''}</div>
          <div class="cr-detail-section"><h2>沟通记录</h2>${ticket.comments.length ? ticket.comments.map(comment => `<article class="cr-comment"><strong>${escapeHtml(comment.author)}</strong><time>${escapeHtml(comment.time)}</time><p>${escapeHtml(comment.content)}</p></article>`).join('') : '<p class="cr-secondary-text">暂无留言</p>'}<form id="comment-form" class="cr-comment-form"><input name="comment" maxlength="500" placeholder="补充说明或询问处理进度" aria-label="留言内容"><button class="cr-btn" type="submit">发送留言</button></form></div>
        </section><aside>
          <section class="cr-panel"><h2>处理负责人</h2><div class="cr-assignee"><span class="cr-avatar">${ticket.assigneeName ? ticket.assigneeName.slice(0,1) : '?'}</span><div><strong>${escapeHtml(ticket.assigneeName || '暂未指派')}</strong><span>${ticket.assigneeName ? '校园维修中心' : '等待接单或管理员指派'}</span></div></div><div class="cr-stack-actions">
            ${canAccept ? `<button class="cr-btn cr-btn-primary" data-action="accept" data-id="${ticket.id}">认领此工单</button>` : ''}
            ${canResolve ? `<button class="cr-btn cr-btn-primary" data-action="resolve" data-id="${ticket.id}">标记维修完成</button>` : ''}
            ${canCancel ? `<button class="cr-btn cr-btn-danger" data-action="cancel" data-id="${ticket.id}">取消工单</button>` : ''}
            ${canClose ? `<button class="cr-btn cr-btn-primary" data-action="close-ticket" data-id="${ticket.id}">确认完成并关闭</button>` : ''}
            ${adminPending ? `<div class="cr-assign-row"><select id="assignee-select" aria-label="选择维修人员"><option value="tech">维修人员</option></select><button class="cr-btn cr-btn-primary" data-action="assign" data-id="${ticket.id}">指派</button></div><button class="cr-btn cr-btn-danger" data-action="cancel" data-id="${ticket.id}">管理员取消</button>` : ''}
            ${adminResolve ? `<button class="cr-btn cr-btn-primary" data-action="resolve" data-id="${ticket.id}">管理员标记解决</button>` : ''}
            ${adminClose ? `<button class="cr-btn cr-btn-primary" data-action="close-ticket" data-id="${ticket.id}">管理员关闭工单</button>` : ''}
            ${!canAccept && !canResolve && !canCancel && !canClose && !adminPending && !adminResolve && !adminClose ? `<button class="cr-btn" disabled>${['CLOSED','CANCELLED'].includes(ticket.status) ? '流程已结束' : '等待下一环节'}</button>` : ''}
          </div></section>
          <section class="cr-panel" style="margin-top:14px"><div class="cr-panel-head"><h2>操作日志</h2><span>只读审计记录</span></div><div class="cr-timeline">${ticket.logs.map(log => `<div class="cr-timeline-item"><span class="cr-timeline-dot"></span><strong>${escapeHtml(log.title)}</strong><span>${escapeHtml(log.detail)}${log.from && log.to && log.from !== log.to ? ` · ${statusLabels[log.from]} → ${statusLabels[log.to]}` : ''}</span></div>`).join('')}</div></section>
        </aside></div>`;
      }

      function renderGuide() {
        return `<div class="cr-modal-layer"><section class="cr-modal" role="dialog" aria-modal="true" aria-labelledby="guide-title"><div class="cr-modal-head"><h2 id="guide-title">学生项目原型说明</h2><button class="cr-modal-close" data-action="close-guide" aria-label="关闭">×</button></div><p class="cr-description" style="margin-bottom:16px">这是六人协作练习的最终目标版原型。顶部角色切换仅用于课堂演示，真实项目使用 JWT 登录和后端权限校验。</p><ul class="cr-checklist"><li>学生：创建、查询本人工单、上传图片、留言、取消待处理工单、验收关闭。</li><li>维修人员：查看工单池、接单、处理本人任务、留言并标记完成。</li><li>管理员：查看统计与全部工单、指派维修人员、处理异常状态。</li><li>公共能力：搜索、状态/分类筛选、分页、401 自动退出、加载与错误反馈。</li><li>后端要求：FastAPI、AsyncSession、SQLAlchemy Async、aiomysql、MySQL。</li><li>协作要求：接口先行、独立分支、Pull Request、自动测试与前后端联调。</li></ul><div class="cr-form-actions" style="margin-top:20px"><button class="cr-btn" data-action="reset-data">重置演示数据</button><button class="cr-btn cr-btn-primary" data-action="close-guide">开始查看原型</button></div></section></div>`;
      }

      function renderView() {
        if (state.view === 'detail') return renderDetail();
        if (state.view === 'new') return renderNewTicket();
        if (state.view === 'tickets' || state.view === 'mine') return renderTickets();
        return renderDashboard();
      }

      function render() {
        if (!state.loggedIn) renderLogin(); else renderApp();
      }

      root.addEventListener('submit', event => {
        event.preventDefault();
        if (event.target.id === 'login-form') {
          const data = new FormData(event.target);
          const username = String(data.get('username') || '').trim();
          const password = String(data.get('password') || '');
          const account = accounts[username];
          if (!account || account.password !== password) {
            state.loginError = '用户名或密码错误，请使用下方演示账号。';
            render();
            return;
          }
          state.username = username;
          state.role = account.role;
          state.loggedIn = true;
          state.view = 'dashboard';
          state.loginError = '';
          showToast(`欢迎回来，${account.name}`);
          return;
        }
        if (event.target.id === 'ticket-form') {
          const data = new FormData(event.target);
          const title = String(data.get('title') || '').trim();
          const description = String(data.get('description') || '').trim();
          const location = String(data.get('location') || '').trim();
          if (title.length < 3 || description.length < 5 || location.length < 2) {
            state.formError = '请完整填写标题、地点和故障描述，并满足最小长度要求。';
            render();
            return;
          }
          const maxNo = Math.max(...state.tickets.map(ticket => Number(ticket.ticketNo.split('-')[1])));
          const ticket = {
            id: `ticket-${Date.now()}`,
            ticketNo: `REP-${String(maxNo + 1).padStart(4,'0')}`,
            title,
            description,
            category: String(data.get('category')),
            location,
            priority: String(data.get('priority') || 'MEDIUM'),
            status: 'PENDING', reporterId: 'student', reporterName: '学生用户', assigneeId: '', assigneeName: '',
            createdAt: nowLabel(), updatedAt: nowLabel(), attachment: state.draftAttachment,
            comments: [], logs: [{ action: 'CREATE', title: '提交报修申请', detail: `学生用户 · ${nowLabel()}`, from: '', to: 'PENDING' }]
          };
          state.tickets.unshift(ticket);
          state.selectedId = ticket.id;
          state.view = 'detail';
          state.formError = '';
          state.draftAttachment = null;
          showToast(`工单 ${ticket.ticketNo} 已提交，等待维修人员接单。`);
          return;
        }
        if (event.target.id === 'comment-form') {
          const ticket = ticketById(state.selectedId);
          const content = String(new FormData(event.target).get('comment') || '').trim();
          if (!ticket || !content) { showToast('请输入留言内容。'); return; }
          ticket.comments.push({ author: roleName(), time: nowLabel(), content });
          addLog(ticket, 'COMMENT', '新增处理留言', ticket.status, ticket.status, roleName());
          showToast('留言已发送。');
        }
      });

      root.addEventListener('change', event => {
        if (event.target.dataset.action === 'photo') {
          const file = event.target.files && event.target.files[0];
          if (!file) { state.draftAttachment = null; render(); return; }
          if (!['image/jpeg','image/png'].includes(file.type) || file.size > 5 * 1024 * 1024) {
            state.formError = '照片必须是 JPG 或 PNG，且不能超过 5 MB。';
            state.draftAttachment = null;
            render();
            return;
          }
          const reader = new FileReader();
          reader.onload = () => { state.draftAttachment = { name: file.name, preview: String(reader.result) }; render(); };
          reader.readAsDataURL(file);
        }
      });

      root.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        const action = target.dataset.action;
        const ticket = target.dataset.id ? ticketById(target.dataset.id) : null;
        if (action === 'quick-login') {
          state.username = target.dataset.user;
          state.role = accounts[state.username].role;
          state.loggedIn = true;
          state.view = 'dashboard';
          state.loginError = '';
          showToast(`已使用${accounts[state.username].label}演示账号登录。`);
        } else if (action === 'switch-role') {
          state.role = target.dataset.role;
          state.username = target.dataset.role;
          state.view = 'dashboard'; state.page = 1; state.status = 'ALL'; state.category = 'ALL'; state.keyword = '';
          showToast(`已切换到${accounts[state.role].label}，角色切换仅用于原型演示。`);
        } else if (action === 'logout') {
          state.loggedIn = false; state.username = 'student'; state.role = 'student'; state.loginError = ''; render();
        } else if (action === 'navigate') {
          state.view = target.dataset.view; state.page = 1; state.formError = ''; render();
        } else if (action === 'open-ticket' && ticket) {
          if (event.target.closest('button') && event.target.closest('button') !== target) return;
          state.selectedId = ticket.id; state.view = 'detail'; render();
        } else if (action === 'open-first-resolved') {
          const first = visibleTickets().find(item => item.status === 'RESOLVED');
          if (first) { state.selectedId = first.id; state.view = 'detail'; render(); } else showToast('当前没有待确认工单。');
        } else if (action === 'search') {
          state.keyword = document.getElementById('ticket-keyword').value;
          state.status = document.getElementById('ticket-status').value;
          state.category = document.getElementById('ticket-category').value;
          state.page = 1; render();
        } else if (action === 'clear-filter') {
          state.keyword = ''; state.status = 'ALL'; state.category = 'ALL'; state.page = 1; render();
        } else if (action === 'page') {
          state.page = Number(target.dataset.page); render();
        } else if (action === 'accept' && ticket) {
          event.stopPropagation();
          if (ticket.status !== 'PENDING') return;
          const from = ticket.status; ticket.status = 'PROCESSING'; ticket.assigneeId = 'tech'; ticket.assigneeName = '维修人员';
          addLog(ticket, 'ACCEPT', '维修人员接单', from, ticket.status, '维修人员');
          state.selectedId = ticket.id; state.view = 'detail'; showToast(`已认领工单 ${ticket.ticketNo}。`);
        } else if (action === 'assign' && ticket) {
          const from = ticket.status; ticket.status = 'PROCESSING'; ticket.assigneeId = 'tech'; ticket.assigneeName = '维修人员';
          addLog(ticket, 'ASSIGN', '管理员指派维修人员', from, ticket.status, '系统管理员 → 维修人员');
          showToast(`工单 ${ticket.ticketNo} 已指派给维修人员。`);
        } else if (action === 'resolve' && ticket) {
          const from = ticket.status; ticket.status = 'RESOLVED';
          ticket.comments.push({ author: roleName(), time: nowLabel(), content: '故障已处理完成，请确认设备是否恢复正常。' });
          addLog(ticket, 'RESOLVE', '维修完成，等待确认', from, ticket.status, roleName());
          showToast('维修结果已提交，等待学生确认。');
        } else if (action === 'close-ticket' && ticket) {
          const from = ticket.status; ticket.status = 'CLOSED';
          addLog(ticket, 'CLOSE', state.role === 'student' ? '学生确认并关闭' : '管理员关闭工单', from, ticket.status, roleName());
          showToast('工单已关闭，业务流程完成。');
        } else if (action === 'cancel' && ticket) {
          const from = ticket.status; ticket.status = 'CANCELLED';
          addLog(ticket, 'CANCEL', state.role === 'admin' ? '管理员取消工单' : '学生取消工单', from, ticket.status, roleName());
          showToast('工单已取消。');
        } else if (action === 'reset-form') {
          state.draftAttachment = null; state.formError = ''; setTimeout(render, 0);
        } else if (action === 'show-guide') {
          state.guide = true; render();
        } else if (action === 'close-guide') {
          state.guide = false; render();
        } else if (action === 'reset-data') {
          state.tickets = cloneTickets(); state.guide = false; state.view = 'dashboard'; state.page = 1;
          showToast('原型演示数据已重置。');
        }
      });

      render();
    })();
  </script>
</body>
</html>
